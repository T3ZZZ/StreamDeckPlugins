<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body { font-family: sans-serif; font-size: 9pt; color: #d8d8d8; background: #2d2d2d; margin: 0; padding: 12px; }
    label { display: block; margin-bottom: 4px; color: #969696; }
    select, input, button { width: 100%; box-sizing: border-box; padding: 5px; margin-bottom: 12px;
        background: #3d3d3d; color: #d8d8d8; border: 1px solid #555; border-radius: 3px; font-size: 9pt; }
    button { cursor: pointer; }
    #status { color: #969696; }
</style>
</head>
<body>
    <label>VST plugin detected in the configuration</label>
    <select id="vst"></select>

    <label>Configuration file</label>
    <input id="config" type="text" placeholder="C:\Program Files\EqualizerAPO\config\config.txt">

    <button id="refresh">Refresh list</button>
    <div id="status"></div>

<script>
let socket;
let uuid;
let settings = {};

function save() {
    socket.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
}

function ask() {
    socket.send(JSON.stringify({
        event: "sendToPlugin",
        context: uuid,
        action: "com.jd.apoequalizeressentials.toggle",
        payload: { config: document.getElementById("config").value.trim() }
    }));
}

function connectElgatoStreamDeckSocket(port, propertyInspectorUUID, registerEvent, info, actionInfo) {
    uuid = propertyInspectorUUID;
    settings = JSON.parse(actionInfo).payload.settings || {};
    document.getElementById("config").value = settings.config || "";

    socket = new WebSocket("ws://127.0.0.1:" + port);
    socket.onopen = () => {
        socket.send(JSON.stringify({ event: registerEvent, uuid: propertyInspectorUUID }));
        ask();
    };

    socket.onmessage = (message) => {
        const data = JSON.parse(message.data);
        if (data.event !== "sendToPropertyInspector") return;

        const select = document.getElementById("vst");
        select.innerHTML = "";
        for (const plugin of data.payload.plugins) {
            const option = document.createElement("option");
            option.value = plugin.id;
            option.textContent = (plugin.enabled ? "\u25CF " : "\u25CB ") + plugin.name;
            option.selected = plugin.id === settings.id;
            select.appendChild(option);
        }

        document.getElementById("status").textContent = data.payload.error
            ? data.payload.error
            : data.payload.plugins.length + " VST plugin(s) detected in " + data.payload.config;

        if (data.payload.plugins.length && !data.payload.plugins.some((plugin) => plugin.id === settings.id)) {
            settings.id = select.value;
            save();
        }
    };
}

document.getElementById("vst").addEventListener("change", (event) => {
    settings.id = event.target.value;
    save();
});

document.getElementById("config").addEventListener("change", (event) => {
    settings.config = event.target.value.trim();
    save();
    ask();
});

document.getElementById("refresh").addEventListener("click", ask);
</script>
</body>
</html>
